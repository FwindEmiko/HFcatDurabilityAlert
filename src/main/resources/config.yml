# ============================================
#  HFcatDurabilityAlert 耐久度警告插件 配置文件
#  狐风轩汐 - F.windEmiko
#  QQ: 2011857087
# ============================================

# ---------- 警告触发条件 ----------
warnings:
  # 警告阈值（剩余耐久百分比 0-100）
  # 从高到低排列，物品耐久每降到一个阈值就触发一次警告
  thresholds:
    - 50
    - 30
    - 15
    - 10
    - 5

  # 同一阈值的重复警告间隔（秒）
  # -1 表示每个阈值只警告一次（物品修复后可重新触发）
  # 填正数表示同一阈值冷却 N 秒后可再次警告（无需修复）
  # 0 为无效值，会按 -1 处理并给出提示
  cooldown: -1

  # 检测哪些部位的物品
  check-armor: true      # 盔甲（头盔/胸甲/护腿/靴子）
  check-mainhand: true   # 主手
  check-offhand: true    # 副手

  # 完全忽略的物品（填物品英文名称，不区分大小写）
  # 例如: - "elytra"  - "shield"
  ignore-items: []

# ---------- 消息显示 ----------
messages:
  # 每个阈值对应的警告文案，格式见下方占位符说明
  #   {item}      物品名称（有自定义名优先显示自定义名）
  #   {slot}      装备部位（主手/副手/头盔/胸甲/护腿/靴子）
  #   {durability} 剩余耐久点数
  #   {max}       最大耐久点数
  #   {percent}   剩余耐久百分比（整数）
  #   {threshold} 触发的阈值百分比
  # 颜色支持 & 代码（&a &c &l 等）或 MiniMessage 标签
  formats:
    - percent: 50
      message: "&e⚠ &f{item} &e耐久度已降至 &6{percent}%&e！ &7({durability}/{max})"
    - percent: 30
      message: "&6⚡ &f{item} &6耐久度仅剩 &6{percent}%&6！ &7({durability}/{max})"
    - percent: 15
      message: "&c✖ &f{item} &c耐久度仅剩 &c{percent}%&c！ &7({durability}/{max})"
    - percent: 10
      message: "&4⚠ &f{item} &4即将损坏！ &7仅剩 {percent}% &8({durability}/{max})"
    - percent: 5
      message: "&4&l!!! &f{item} &4&l马上要坏掉啦！ &7仅剩 {percent}% &8({durability}/{max})"

  # 警告的显示位置（可同时开启多项）
  send-chat: true        # 聊天框
  send-actionbar: true   # 动作栏（经验条上方）
  send-title: false      # 屏幕中央大字 Title

  # 物品彻底损坏（耐久归零）时的提示文案，留空则不提示
  break-message: "&4&l!!! &f{item} &4&l已损坏！"

  # 警告时播放的声音，留空则不播放（物品损坏时也会播放此声音）
  # 格式: 声音名 或 声音名:音量:音调，仅用 Bukkit 声音名、不带 minecraft: 前缀
  # 例如: ENTITY_EXPERIENCE_ORB_PICKUP:1.0:1.0
  warning-sound: "ENTITY_EXPERIENCE_ORB_PICKUP:0.8:1.2"

# ---------- 经验修补（Mending）特殊处理 ----------
mending:
  # 带"经验修补"附魔的物品延迟警告：耐久降到此百分比以下才提示
  # 会覆盖上方通用阈值，仅使用 <= 此值的档位；设为 -1 或 0 关闭此功能
  mending-only-warn-below: 5

# ---------- 调试 ----------
# 开启后向控制台输出详细日志，一般仅在开发者排查问题时开启
debug: false
