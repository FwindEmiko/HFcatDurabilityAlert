# Gradle 8.12 必须在 JDK 21 上运行（不支持 JDK 25）
# 编译由 toolchain 自动调用 JDK 25（见下方 paths）
# 注意：Windows 路径写在此处；Linux 用户需修改为本机路径或使用 -D 参数传入
org.gradle.java.installations.paths=F:/env/jdk/azul-25.0.3,F:/env/jdk/azul-21.0.11
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false
